name: Release
on:
  push:
    tags:
      - 'v*'
jobs:
  package:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            formats: deb
            artifact: pong-linux
          - os: windows-latest
            formats: wix
            artifact: pong-windows
          - os: macos-latest
            formats: app
            artifact: pong-mac-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev fuse libfuse2
      - name: Install cargo-packager
        run: cargo install cargo-packager --locked
      - name: Build
        run: cargo build --release
      - name: Package
        run: cargo packager --release --formats ${{ matrix.formats }}
      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p staging
          find target/release -maxdepth 1 \( -name "*.deb" -o -name "*.msi" \) -exec cp {} staging/ \;
          find target/release -maxdepth 1 -name "*.app" -print0 | while IFS= read -r -d '' app; do
            ditto -c -k --keepParent "$app" "staging/$(basename "$app").zip"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: staging/
  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2.3.2
        with:
          files: "**/*"
