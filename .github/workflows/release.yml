name: Release
on:
  push:
    tags:
      - 'v*'
jobs:
  package:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            formats: appimage,deb
            artifact: pong-linux
          - os: windows-latest
            formats: wix
            artifact: pong-windows
          - os: macos-latest
            arch: aarch64-apple-darwin
            formats: app
            artifact: pong-mac-arm
          - os: macos-latest
            arch: x86_64-apple-darwin
            formats: app
            artifact: pong-mac-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch }}
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev fuse libfuse2
      - name: Install cargo-packager
        run: cargo install cargo-packager --locked
      - name: Package
        run: cargo packager --release --formats ${{ matrix.formats }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/release/bundle/
  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: "**/*"
